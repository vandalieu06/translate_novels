<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>novel-cli web</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0575f'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"
  />
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("novel_web_theme") || "auto";
      } catch (e) {
        document.documentElement.dataset.theme = "auto";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-page="landing">
  <!--partial:header-->

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <h1 class="page-title" id="descargar">Nueva descarga</h1>
          <p class="section-desc">
            Pega la URL de una web novel o sube un PDF. El progreso aparece abajo
            y sigue aunque cambies de página.
          </p>
        </div>

        <div class="task">
          <div class="segmented" id="source-switch" role="tablist" aria-label="Origen">
            <button type="button" role="tab" data-source="web" aria-selected="true">
              Desde web
            </button>
            <button type="button" role="tab" data-source="pdf" aria-selected="false">
              Desde PDF
            </button>
          </div>

          <form class="card job-form" id="job-form" data-panel="web">
            <div class="field url-field">
              <label for="job-url">URL de la web novel</label>
              <input type="url" id="job-url" placeholder="https://novelfire.net/..." required />
            </div>

            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="job-translate" />
                <span>Traducir</span>
              </label>
              <div class="field translate-lang-field" id="field-language" hidden>
                <label for="job-language">Idioma de traducción</label>
                <select id="job-language"></select>
              </div>
            </div>

            <button
              type="button"
              class="advanced-toggle"
              id="advanced-toggle"
              aria-expanded="false"
              aria-controls="advanced-panel"
            >
              <span data-icon="chevron-down"></span>Opciones avanzadas
            </button>

            <div class="advanced-panel" id="advanced-panel" hidden>
              <div class="row-fields">
                <div class="field">
                  <label for="job-volume">Capítulos por tomo</label>
                  <select id="job-volume">
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="150">150</option>
                    <option value="200">200</option>
                  </select>
                </div>
                <div class="field">
                  <label for="job-concurrency">Concurrencia descarga</label>
                  <input type="number" id="job-concurrency" value="4" min="1" />
                </div>
                <div class="field" id="field-translate-concurrency" hidden>
                  <label for="job-translate-concurrency">Concurrencia traducción</label>
                  <input type="number" id="job-translate-concurrency" value="4" min="1" />
                </div>
              </div>
              <div class="checkbox-group">
                <label><input type="checkbox" id="job-all" /> Todos los capítulos</label>
                <label><input type="checkbox" id="job-pending" /> Traducir pendientes</label>
                <label><input type="checkbox" id="job-force" /> Forzar re-descarga</label>
                <label><input type="checkbox" id="job-playwright" /> Forzar Playwright</label>
              </div>
            </div>

            <div class="form-actions">
              <button
                type="submit"
                class="btn btn-primary btn-lg"
                id="job-submit"
                data-label="Lanzar descarga"
                data-loading="Lanzando..."
              >
                <span class="spinner"></span>
                <span class="btn-label">Lanzar descarga</span>
              </button>
            </div>
          </form>

          <form class="card job-form" id="pdf-form" data-panel="pdf" hidden>
            <div class="field url-field">
              <label for="pdf-file">Archivo PDF</label>
              <input type="file" id="pdf-file" accept=".pdf,application/pdf" required />
              <p class="field-hint">
                Webnovel o light novel con ilustraciones. El EPUB original conserva
                el formato del PDF.
              </p>
            </div>
            <div class="row-fields">
              <div class="field">
                <label for="pdf-source">Idioma del PDF</label>
                <select id="pdf-source"></select>
              </div>
              <div class="field">
                <label for="pdf-volume">Capítulos por tomo</label>
                <select id="pdf-volume">
                  <option value="50" selected>50</option>
                  <option value="100">100</option>
                  <option value="150">150</option>
                  <option value="200">200</option>
                </select>
              </div>
            </div>
            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="pdf-translate" />
                <span>Traducir</span>
              </label>
              <div class="field translate-lang-field" id="pdf-field-language" hidden>
                <label for="pdf-language">Idioma de traducción</label>
                <select id="pdf-language"></select>
              </div>
            </div>
            <div class="form-actions">
              <button
                type="submit"
                class="btn btn-primary btn-lg"
                id="pdf-submit"
                data-label="Subir y convertir"
                data-loading="Subiendo..."
              >
                <span class="spinner"></span>
                <span class="btn-label">Subir y convertir</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-header header-with-action">
          <div>
            <h2>Recientes</h2>
            <p class="section-desc">Tus novelas más actualizadas.</p>
          </div>
          <a class="btn btn-secondary" href="/biblioteca">Ver biblioteca</a>
        </div>
        <div class="cover-grid" id="recent-list">
          <div class="empty">Cargando…</div>
        </div>
      </div>
    </section>
  </main>

  <!--partial:jobbar-->
  <!--partial:footer-->

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/jobs.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
