<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca · novel-cli web</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fa6f78'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@200;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-page="library">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <span class="logo">N</span>
        novel<span>-cli</span>
      </a>
      <nav id="main-nav">
        <a href="/" data-nav="landing">Descargar</a>
        <a href="/biblioteca" data-nav="library">Biblioteca</a>
        <a href="/ayuda" data-nav="help">Ayuda</a>
      </nav>
      <div class="spacer"></div>
      <span class="backend-pill" id="backend-pill" hidden></span>
      <div class="server-status" id="server-status">
        <span class="dot"></span><span id="server-status-text">Servidor OK</span>
      </div>
    </div>
  </header>

  <section class="section page-intro">
    <div class="container">
      <div class="section-header header-with-action">
        <div>
          <div class="kicker">Biblioteca</div>
          <h2>Tus novelas</h2>
          <p class="section-desc">Toca una portada para ver la ficha de la novela, sus acciones y los EPUB generados.</p>
        </div>
        <a class="btn btn-secondary" href="/">Nueva descarga</a>
      </div>
      <div class="cover-grid" id="cover-grid">
        <div class="empty">Cargando...</div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <span class="foot-brand">novel-cli web</span>
      <span>FastAPI + UI responsive · diseño MOSH</span>
    </div>
  </footer>

  <div id="toast"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/library.js"></script>
</body>
</html>
