<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca · novel-cli web</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0575f'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"
  />
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("novel_web_theme") || "auto";
      } catch (e) {
        document.documentElement.dataset.theme = "auto";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-page="library">
  <!--partial:header-->

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header header-with-action">
          <div>
            <h1 class="page-title">Biblioteca</h1>
            <p class="section-desc">Tus novelas descargadas.</p>
          </div>
          <a class="btn btn-secondary" href="/">Nueva descarga</a>
        </div>

        <div class="library-controls">
          <div class="search-field">
            <span class="search-icon" data-icon="search"></span>
            <input
              type="search"
              id="lib-search"
              placeholder="Buscar por título o autor"
              aria-label="Buscar novelas"
            />
          </div>
          <div class="segmented" id="lib-filter" role="group" aria-label="Filtrar">
            <button type="button" data-filter="all" aria-pressed="true">Todas</button>
            <button type="button" data-filter="translated">Traducidas</button>
            <button type="button" data-filter="empty">Con vacíos</button>
            <button type="button" data-filter="pdf">PDF</button>
          </div>
          <label class="sort-field">
            <span class="label">Orden</span>
            <select id="lib-sort">
              <option value="recent">Recientes</option>
              <option value="title">Título</option>
            </select>
          </label>
          <div class="segmented density" id="lib-density" role="group" aria-label="Densidad">
            <button type="button" data-density="grid" aria-pressed="true" aria-label="Cuadrícula">
              <span data-icon="grid"></span>
            </button>
            <button type="button" data-density="list" aria-pressed="false" aria-label="Lista">
              <span data-icon="list"></span>
            </button>
          </div>
        </div>

        <p class="result-count" id="lib-count"></p>
        <div class="cover-grid" id="cover-grid">
          <div class="empty">Cargando…</div>
        </div>
      </div>
    </section>
  </main>

  <!--partial:jobbar-->
  <!--partial:footer-->

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/jobs.js"></script>
  <script src="/static/js/library.js"></script>
</body>
</html>
