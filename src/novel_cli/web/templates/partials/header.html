<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="logo">N</span>novel<span>-cli</span></a>
    <nav id="main-nav">
      <a href="/" data-nav="landing">Descargar</a>
      <a href="/biblioteca" data-nav="library">Biblioteca</a>
      <a href="/ayuda" data-nav="help">Ayuda</a>
    </nav>
    <div class="spacer"></div>
    <span class="backend-pill" id="backend-pill" hidden></span>
    <button
      class="btn btn-secondary btn-icon"
      id="job-indicator"
      type="button"
      aria-label="Job en curso"
      aria-expanded="false"
      hidden
    ></button>
    <div class="settings-wrap">
      <button
        class="btn btn-secondary btn-icon"
        id="settings-btn"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-label="Ajustes"
      ></button>
      <div class="popover" id="settings-popover" hidden role="dialog" aria-label="Ajustes">
        <div class="menu-label">Tema</div>
        <div class="segmented" id="theme-options" role="group" aria-label="Tema">
          <button type="button" data-theme-value="auto">Auto</button>
          <button type="button" data-theme-value="light">Claro</button>
          <button type="button" data-theme-value="dark">Oscuro</button>
        </div>
        <div class="menu-label menu-group">Token de acceso</div>
        <div class="field">
          <input
            type="password"
            id="settings-token"
            placeholder="NOVEL_WEB_TOKEN"
            autocomplete="off"
          />
        </div>
        <div class="form-actions menu-group">
          <button type="button" class="btn btn-primary" id="settings-save">Guardar</button>
        </div>
        <p class="field-hint menu-group" id="settings-hint"></p>
      </div>
    </div>
  </div>
</header>
