[project]
name = "novel_cli"
version = "0.2.0"
description = "Descarga web novels y las convierte a EPUB, con traduccion opcional a espanol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
    "brotli>=1.1",
    "ebooklib>=0.18",
    "lxml>=5",
    "cssselect>=1.2",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff",
]

[project.scripts]
novel-cli = "novel_cli.cli.app:main"
novel-cli-web = "novel_cli.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
